name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # Job 1 : Secret Scanning with Gitleaks
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v $(pwd):/path zricethezav/gitleaks:latest detect \
            --source /path \
            --exit-code 1 \
            -v

  #Job 2 : Container Scanning with Trivy
  trivy:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-demo .

      - name: Run Trivy vulnerability scanner 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-demo
          format: table
          exit-code: 1
          severity: CRITICAL